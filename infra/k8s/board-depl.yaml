apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manging-board-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manging-board
  template:
    metadata:
      labels:
        app: task-manging-board
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox
          command: ['sh', '-c', 'until nc -z $RABBITMQ_HOST $RABBITMQ_PORT; do echo "Waiting for RabbitMQ..."; sleep 2; done; echo "RabbitMQ is up!"']
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq-svc
            - name: RABBITMQ_PORT
              value: "5672"
      containers:
      - name: task-manging-board
        image: rohanpagare75/task-manging-board
        env: 
          - name: COK_KEY
            value: 'badawuidnauiwhndaiwnd'
          - name: PORT
            value: "3000"
          - name: MONGO_URI
            value: 'mongodb://task-manging-board-mongo-srv:27017/board_db'
          - name: JWT_KEY
            value: 'andojianduiawnjduiawndiawnudiua'
          - name: NODE_ENV
            value: prod
          - name: RABBITMQ_URL
            value: rabbitmq-svc
          - name: RABBITMQ_USER
            value: guest
          - name: RABBITMQ_PASS
            value: guest
          - name: RABBITMQ_PORT
            value: "5672"

        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: task-manging-board-srv
spec:
  selector:
    app: task-manging-board
  ports:
    - name: task-manging-board
      protocol: TCP
      port: 3000
      targetPort: 3000