apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manging-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manging-auth
  template:
    metadata:
      labels:
        app: task-manging-auth
    spec:
      containers:
      - name: task-manging-auth
        image: rohanpagare75/task-manging-auth
        env: 
          - name: COK_KEY
            value: 'badawuidnauiwhndaiwnd'
          - name: PORT
            value: "3000"
          - name: DB_HOST
            value: 'task-manging-auth-postgres-srv'
          - name: DB_PORT
            value: "5432"
          - name: DB_USER
            value: postgres
          - name: DB_PASS
            value: postgres
          - name: DB_NAME
            value: auth_db
          - name: JWT_KEY
            value: 'andojianduiawnjduiawndiawnudiua'
          - name: NODE_ENV
            value: prod
          - name: RABBITMQ_URL
            value: rabbitmq-svc
          - name: RABBITMQ_USER
            value: guest
          - name: RABBITMQ_PASS
            value: guest
          - name: RABBITMQ_PORT
            value: "5672"

        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: task-manging-auth-srv
spec:
  selector:
    app: task-manging-auth
  ports:
    - name: task-manging-auth
      protocol: TCP
      port: 3000
      targetPort: 3000