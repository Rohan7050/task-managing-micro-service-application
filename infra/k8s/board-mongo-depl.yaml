apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manging-board-mongo-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manging-board-mongo
  template:
    metadata:
      labels:
        app: task-manging-board-mongo
    spec:
      containers:
      - name: task-manging-board-mongo
        image: mongo
---
apiVersion: v1
kind: Service
metadata:
  name: task-manging-board-mongo-srv
spec:
  selector:
    app: task-manging-board-mongo
  ports:
  - name: db
    protocol: TCP
    port: 27017
    targetPort: 27017
